<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>محفظة بلي</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root{
      --bg0:#060812;
      --bg1:#070b16;
      --glass: rgba(255,255,255,.06);
      --glass2: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.10);

      --text:#eaf0ff;
      --muted:#a7b3cc;

      --accent:#7c3aed; /* purple */
      --accent2:#22c55e; /* green */
      --warn:#f59e0b;
      --danger:#ef4444;

      --r:18px;
      --r2:14px;
      --shadow: 0 24px 80px rgba(0,0,0,.55);
      --shadow2: 0 16px 55px rgba(0,0,0,.45);

      --mono: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    }

    *{ box-sizing:border-box; }
    html, body{
      height:100%;
      margin:0;
      overflow:hidden;               /* ✅ لا سكرول للصفحة */
      overscroll-behavior:none;
      background: radial-gradient(900px 520px at 12% 10%, rgba(124,58,237,.18), transparent 60%),
                  radial-gradient(700px 520px at 88% 18%, rgba(34,197,94,.12), transparent 65%),
                  linear-gradient(180deg,var(--bg0),var(--bg1));
      color:var(--text);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial;
    }

    /* ✅ Container layout */
    .wrap{
      height:100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 14px 16px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 4px 2px 0;
    }

    .brand{
      display:flex; align-items:center; gap:10px;
      min-width: 0;
    }
    .logo{
      width:40px;height:40px;border-radius:14px;
      background:
        radial-gradient(14px 14px at 30% 30%, rgba(255,255,255,.35), transparent 60%),
        linear-gradient(135deg, rgba(124,58,237,.85), rgba(34,197,94,.35));
      border:1px solid rgba(255,255,255,.14);
      box-shadow: 0 18px 55px rgba(0,0,0,.45);
    }
    .brandText{display:flex;flex-direction:column;gap:2px;min-width:0}
    .brandText b{font-weight:950;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brandText small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .iconBtn{
      width:42px;height:42px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      display:grid; place-items:center;
      cursor:pointer;
      box-shadow: 0 12px 40px rgba(0,0,0,.28);
    }
    .iconBtn:active{ transform: translateY(1px); }
    .iconBtn svg{ width:18px;height:18px; opacity:.9; }

    .card{
      background: var(--glass);
      border:1px solid var(--stroke);
      border-radius: var(--r);
      box-shadow: var(--shadow2);
      backdrop-filter: blur(14px);
    }

    /* ✅ Main content area */
    .content{
      flex:1;
      overflow:hidden;   /* ✅ يمنع سكرول عام */
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    /* Gate */
    .gate{
      flex:1;
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    .gateInner{
      width:min(560px,100%);
      padding:16px;
    }
    .primaryBtn{
      width:100%;
      padding:14px 14px;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.16);
      background:
        radial-gradient(420px 120px at 50% -20%, rgba(255,255,255,.18), transparent 60%),
        linear-gradient(135deg, rgba(124,58,237,.40), rgba(59,130,246,.18));
      color:#fff;
      font-weight:950;
      letter-spacing:.2px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      box-shadow: 0 18px 65px rgba(0,0,0,.45);
    }
    .primaryBtn:active{ transform: translateY(1px); }
    .primaryBtn:disabled{ opacity:.5; cursor:not-allowed; }

    .hint{ margin-top:10px; color:var(--muted); font-size:12px; line-height:1.7; }
    .err{
      margin-top:10px;
      display:none;
      white-space:pre-wrap;
      word-break:break-word;
      font-size:12px;
      color: rgba(255,255,255,.92);
      background: rgba(0,0,0,.20);
      border:1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      padding:10px;
    }

    /* Wallet view */
    .wallet{
      display:none;
      flex:1;
      overflow:hidden;
      flex-direction:column;
      gap:12px;
    }

    .pad{ padding:16px; }

    .balanceHeader{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .balLeft{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
    }
    .balLabel{
      color:var(--muted);
      font-size:12px;
    }
    .balNum{
      font-size:44px;
      font-weight: 1000;
      letter-spacing:.3px;
      line-height:1;
      background: linear-gradient(90deg, rgba(255,255,255,.95), rgba(167,139,250,.95));
      -webkit-background-clip:text;
      background-clip:text;
      color: transparent;
    }
    .balMeta{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      font-size:12px;
      color: var(--muted);
    }
    .chip{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      display:flex; gap:6px; align-items:center;
      white-space:nowrap;
    }
    .chip b{ color: rgba(255,255,255,.92); font-weight:900; }
    .chip.warn b{ color: #ffd38a; }
    .chip.danger b{ color: #ffb1b1; }

    .trialBox{
      text-align:left;
      display:none;
      padding:10px 12px;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(239,68,68,.08);
      min-width: 120px;
    }
    .trialNum{ font-weight:950; color:#ffb1b1; font-size:18px; line-height:1.2; }
    .trialNote{ color: var(--muted); font-size:11px; line-height:1.2; margin-top:3px; }

    /* Actions - modern */
    .actions{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:10px;
      margin-top: 14px;
    }
    .action{
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.10);
      background:
        radial-gradient(220px 100px at 50% -20%, rgba(255,255,255,.10), transparent 65%),
        rgba(255,255,255,.04);
      padding: 12px 10px;
      cursor:pointer;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      box-shadow: 0 14px 50px rgba(0,0,0,.28);
    }
    .action:active{ transform: translateY(1px); }
    .action .ic{
      width:44px;height:44px;border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      display:grid; place-items:center;
    }
    .action .ic svg{ width:22px; height:22px; opacity:.95; }
    .action b{ font-weight:950; font-size:13px; }
    .action small{ color:var(--muted); margin-top:-8px; font-size:11px; }

    /* History title */
    .sectionTitle{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding: 0 4px;
      color: rgba(255,255,255,.92);
      font-weight: 950;
      font-size: 13px;
    }

    /* ✅ History scroll area */
    .historyScroll{
      flex:1;
      overflow:auto;                 /* ✅ سكرول داخلي */
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      display:flex;
      flex-direction:column;
      gap:10px;
      padding-bottom: 2px;
    }

    .item{
      padding:12px 12px;
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .left{display:flex;align-items:center;gap:10px;min-width:0}
    .badge{
      width:38px;height:38px;border-radius:16px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      display:grid; place-items:center;
      flex:0 0 auto;
    }
    .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
    .meta b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meta small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .amt{font-weight:950;font-size:13px;white-space:nowrap}
    .amt.out{color: rgba(255,255,255,.92)}
    .amt.in{color: #86efac}

    .statusTag{
      font-weight:900;
      font-size:11px;
      padding:3px 8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.14);
      margin-inline-start:6px;
      white-space:nowrap;
    }
    .s0{color:#ffd38a}
    .s1{color:#86efac}

    /* Bottom sheet */
    .backdrop{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.55);
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding: 12px 12px 14px;
      z-index: 999;
    }
    .sheet{
      width: min(760px, 100%);
      max-height: 86vh; /* ✅ */
      border-radius: 22px;
      border:1px solid rgba(255,255,255,.14);
      background:
        radial-gradient(560px 140px at 50% -20%, rgba(255,255,255,.10), transparent 70%),
        rgba(10,14,25,.96);
      box-shadow: 0 40px 120px rgba(0,0,0,.60);
      backdrop-filter: blur(16px);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .head{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      padding: 12px 12px 10px;
      border-bottom:1px solid rgba(255,255,255,.08);
      flex:0 0 auto;
    }
    .title{font-weight:950}
    .close{
      width:42px;height:42px;border-radius:16px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      display:grid;place-items:center;
      cursor:pointer;
    }
    .close svg{width:18px;height:18px;opacity:.9}
    .body{
      padding: 12px;
      overflow:auto;                 /* ✅ سكرول داخل الشيت */
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .field{
      width:100%;
      padding:12px 12px;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.20);
      color: rgba(255,255,255,.92);
      outline:none;
      font-size:14px;
      font-family: var(--mono);
    }
    .row{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .btnRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .btn{
      padding:12px 12px;
      border-radius: 16px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.92);
      cursor:pointer;
      font-weight:950;
      font-size:13px;
      flex: 1 1 auto;
    }
    .btn.primary{
      background: rgba(124,58,237,.18);
      border-color: rgba(124,58,237,.30);
    }
    .btn.good{
      background: rgba(34,197,94,.14);
      border-color: rgba(34,197,94,.24);
    }
    .btn.ghost{
      background: rgba(255,255,255,.04);
    }
    .btn:active{ transform: translateY(1px); }

    .pills{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .pill{
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      cursor:pointer;
      font-weight:950;
      font-size:12px;
    }
    .pill:active{ transform: translateY(1px); }

    .panel{
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      padding: 12px;
      margin-top: 10px;
    }
    .panelTitle{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-weight:950;
      color: rgba(255,255,255,.92);
      margin-bottom: 8px;
      font-size: 13px;
    }
    .kv{
      display:flex;
      justify-content:space-between;
      gap:10px;
      color: var(--muted);
      font-size: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .kv:last-child{ border-bottom: 0; padding-bottom: 0; }
    .kv b{
      color: rgba(255,255,255,.92);
      font-weight:950;
      font-family: var(--mono);
      direction:ltr;
      text-align:left;
      margin-right: 10px;
      white-space:nowrap;
    }

    /* Toast */
    .toastWrap{
      position:fixed;
      left:0; right:0;
      bottom: 14px;
      display:flex;
      justify-content:center;
      pointer-events:none;
      padding: 0 12px;
      z-index: 2000;
    }
    .toast{
      pointer-events:none;
      opacity:0;
      transform: translateY(10px);
      transition: .18s ease;
      width: min(760px, 100%);
      padding: 12px 14px;
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(10,14,25,.92);
      color: rgba(255,255,255,.92);
      box-shadow: 0 22px 70px rgba(0,0,0,.55);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-size: 13px;
      backdrop-filter: blur(10px);
    }
    .toast.show{ opacity:1; transform: translateY(0); }
    .toast .tag{ font-weight:950; font-size:12px; opacity:.9; }
    .toast.info .tag{ color:#c4b5fd; }
    .toast.ok .tag{ color:#86efac; }
    .toast.err .tag{ color:#fca5a5; }

    @media (max-width: 420px){
      .balNum{ font-size: 40px; }
      .actions{ gap: 8px; }
      .action{ padding: 10px 8px; }
      .action .ic{ width:40px;height:40px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="logo"></div>
        <div class="brandText">
          <b id="brandTitle">محفظة بلي</b>
          <small id="brandSub">TON • بلي</small>
        </div>
      </div>

      <button class="iconBtn" id="closeApp" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M6 6l12 12M18 6L6 18" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="content">
      <div id="gate" class="gate">
        <div class="card gateInner">
          <button id="open" class="primaryBtn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" stroke="white" stroke-width="2" opacity=".6"/>
              <path d="M4 4l16 16" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
            فتح المحفظة
          </button>
          <div class="hint"> اضغط للفتح<b></b> </div>
          <div id="gateErr" class="err"></div>
        </div>
      </div>

      <div id="wallet" class="wallet">
        <div class="card pad">
          <div class="balanceHeader">
            <div class="balLeft">
              <div class="balLabel" id="balLabel">رصيدك (بلي)</div>
              <div id="points" class="balNum">—</div>
              <div class="balMeta">
                <div class="chip warn" id="frozenRow" style="display:none;">مجمّد: <b id="frozen">—</b></div>
                <div class="chip" id="rateRow">سعر البلي: <b id="rate">—</b> USD</div>
              </div>
            </div>

            <div id="trialBox" class="trialBox">
              <div class="trialNum" id="trial">—</div>
              <div class="trialNote" id="trialNote">يسترد لاحقا</div>
            </div>
          </div>

          <div class="actions">
            <div class="action" id="add">
              <div class="ic">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M12 3v10m0 0l-4-4m4 4l4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M4 17h16" stroke="white" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </div>
              <b>شراء بلي</b>
              <small>TON</small>
            </div>

            <div class="action" id="send">
              <div class="ic">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M3 11l18-8-8 18-2-7-8-3z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <b>إرسال</b>
              <small>بلي</small>
            </div>

            <div class="action" id="receive">
              <div class="ic">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M12 21V11m0 0l4 4m-4-4l-4 4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M4 7h16" stroke="white" stroke-width="2" stroke-linecap="round"/>
                </svg>
              </div>
              <b>استلام</b>
              <small>Code</small>
            </div>
          </div>
        </div>

        <div class="sectionTitle">
          <span>آخر العمليات</span>
        </div>

        <div id="history" class="historyScroll"></div>
      </div>
    </div>
  </div>

  <!-- Bottom sheet -->
  <div id="backdrop" class="backdrop">
    <div class="sheet">
      <div class="head">
        <div id="sheetTitle" class="title">—</div>
        <button class="close" id="closeSheet" aria-label="Close sheet">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M6 6l12 12M18 6L6 18" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div id="sheetBody" class="body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toastWrap">
    <div id="toast" class="toast info">
      <span class="tag">INFO</span>
      <span id="toastMsg">—</span>
    </div>
  </div>

  <script>
    /* ================== api.json ================== */
    let API_BASE = "";
    let TON_PRICE_URL = "";

    async function loadApiJson() {
      if (API_BASE && TON_PRICE_URL) return;
      const res = await fetch("api.json", { cache: "no-store" });
      if (!res.ok) throw new Error("api.json not found");
      const cfg = await res.json();
      API_BASE = String(cfg.API_BASE || "").replace(/\/$/, "");
      TON_PRICE_URL = String(cfg.TON_PRICE_URL || "").trim();
      if (!API_BASE) throw new Error("API_BASE missing in api.json");
      if (!TON_PRICE_URL) throw new Error("TON_PRICE_URL missing in api.json");
    }

    async function fetchTonUsd() {
      await loadApiJson();
      const res = await fetch(TON_PRICE_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("Failed to fetch TON price");
      const data = await res.json();
      const usd = data?.["the-open-network"]?.usd;
      if (!usd || typeof usd !== "number") throw new Error("TON USD price missing");
      return usd;
    }

    /* ================== DOM ================== */
    const gate = document.getElementById("gate");
    const wallet = document.getElementById("wallet");
    const gateErr = document.getElementById("gateErr");

    const pointsEl = document.getElementById("points");
    const frozenRow = document.getElementById("frozenRow");
    const frozenEl = document.getElementById("frozen");
    const rateEl = document.getElementById("rate");

    const trialBox = document.getElementById("trialBox");
    const trialEl = document.getElementById("trial");
    const trialNoteEl = document.getElementById("trialNote");

    const historyEl = document.getElementById("history");

    const backdrop = document.getElementById("backdrop");
    const sheetTitle = document.getElementById("sheetTitle");
    const sheetBody = document.getElementById("sheetBody");

    const toastEl = document.getElementById("toast");
    const toastMsgEl = document.getElementById("toastMsg");
    let toastTimer = null;

    /* ================== State ================== */
    let state = {
      user_id: 0,
      points: 0,
      frozen: 0,
      trial: 0,
      trial_note: "يسترد لاحقا",

      point_name: "بلي",
      point_price_usd: 0,
      min_add_points: 10,

      min_send_points: 13,   // ✅ من الداتا (bootstrap)
      ton_address: ""
    };

    function tg(){ return (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null; }

    function showGateErr(msg){
      gateErr.style.display = "block";
      gateErr.textContent = msg;
    }

    function toast(msg, kind="info", ms=2200){
      clearTimeout(toastTimer);
      toastEl.className = "toast " + kind + " show";
      toastEl.querySelector(".tag").textContent = (kind === "ok") ? "OK" : (kind === "err") ? "ERROR" : "INFO";
      toastMsgEl.textContent = msg;
      toastTimer = setTimeout(()=> toastEl.className = "toast " + kind, ms);
    }

    function joinUrl(base, path){
      if (base.endsWith("/") && path.startsWith("/")) return base.slice(0,-1)+path;
      if (!base.endsWith("/") && !path.startsWith("/")) return base+"/"+path;
      return base+path;
    }

    async function apiFetch(path, {method="GET", body=null} = {}){
      const t = tg();
      if (!t || !t.initData || t.initData.length === 0) {
        throw new Error("initData غير موجود. افتحها من Telegram عبر زر web_app.");
      }
      await loadApiJson();

      const url = joinUrl(API_BASE, path) + (path.includes("?") ? "&" : "?") + "t=" + Date.now();

      const res = await fetch(url, {
        method,
        cache: "no-store",
        headers: {
          "Content-Type":"application/json",
          "X-Telegram-Init-Data": t.initData
        },
        body: body ? JSON.stringify(body) : null
      });

      const ct = (res.headers.get("content-type")||"").toLowerCase();
      if (!ct.includes("application/json")) {
        throw new Error("الـ API رجّع HTML بدل JSON. تأكد من api.json");
      }

      const data = await res.json().catch(()=>null);
      const detail =
        (data && typeof data.detail === "string" && data.detail.trim())
          ? data.detail.trim()
          : "حدث خطأ غير متوقع";

      if (!res.ok) throw new Error(detail);
      return data;
    }

    async function copy(text){
      try{
        await navigator.clipboard.writeText(text);
        const t = tg();
        if (t && t.HapticFeedback) t.HapticFeedback.impactOccurred("light");
        toast("تم النسخ", "ok", 1400);
      }catch{
        toast("تعذّر النسخ", "err");
      }
    }

    function openSheet(title, html){
      sheetTitle.textContent = title;
      sheetBody.innerHTML = html;
      backdrop.style.display = "flex";
    }
    function closeSheet(){
      backdrop.style.display = "none";
      sheetBody.innerHTML = "";
    }
    document.getElementById("closeSheet").onclick = closeSheet;
    backdrop.addEventListener("click", (e)=>{ if(e.target === backdrop) closeSheet(); });

    function fmtTime(ts){
      try { return new Date(ts*1000).toLocaleString("ar"); }
      catch { return String(ts); }
    }

    function escapeHtml(s){
      return String(s || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function render(){
      pointsEl.textContent = state.points;

      // السعر
      rateEl.textContent = state.point_price_usd ? state.point_price_usd.toFixed(4) : "—";

      // trial
      if (state.trial > 0) {
        trialBox.style.display = "block";
        trialEl.textContent = String(state.trial);
        trialNoteEl.textContent = state.trial_note || "يسترد لاحقا";
      } else {
        trialBox.style.display = "none";
      }

      // frozen
      if (state.frozen > 0) {
        frozenRow.style.display = "flex";
        frozenEl.textContent = String(state.frozen);
      } else {
        frozenRow.style.display = "none";
      }
    }

    function renderHistory(items){
      if (!items || items.length === 0){
        historyEl.innerHTML = `
          <div class="item">
            <div class="left">
              <div class="badge">✨</div>
              <div class="meta">
                <b>لا يوجد عمليات بعد</b>
                <small>ستظهر هنا الإرسال/الاستلام/الإضافة/الأجور</small>
              </div>
            </div>
          </div>`;
        return;
      }

      historyEl.innerHTML = items.map(t => {
        if (t.kind === "fee") {
          const note = escapeHtml(t.note || "—");
          return `
            <div class="item">
              <div class="left">
                <div class="badge">💸</div>
                <div class="meta">
                  <b>أجور مهمة</b>
                  <small>${note} • ${fmtTime(t.ts)}</small>
                </div>
              </div>
              <div class="amt out">-${t.amount}</div>
            </div>`;
        }

        if (t.kind === "add") {
          return `
            <div class="item">
              <div class="left">
                <div class="badge">➕</div>
                <div class="meta">
                  <b>شراء بلي</b>
                  <small>${fmtTime(t.ts)}</small>
                </div>
              </div>
              <div class="amt in">+${t.amount}</div>
            </div>`;
        }

        const isOut = t.from_uid === state.user_id;
        const title = isOut ? "إرسال بلي" : "استلام بلي";
        const sub = isOut ? `إلى UID: ${t.to_uid}` : `من UID: ${t.from_uid}`;
        const amtCls = isOut ? "out" : "in";
        const sign = isOut ? "-" : "+";

        let stHtml = "";
        if (isOut && typeof t.status === "number") {
          if (t.status === 0) stHtml = `<span class="statusTag s0">جار الإرسال</span>`;
          else if (t.status === 1) stHtml = `<span class="statusTag s1">مكتمل</span>`;
        }

        return `
          <div class="item">
            <div class="left">
              <div class="badge">${isOut ? "↗️" : "↙️"}</div>
              <div class="meta">
                <b>${title} ${stHtml}</b>
                <small>${sub} • ${fmtTime(t.ts)}</small>
              </div>
            </div>
            <div class="amt ${amtCls}">${sign}${t.amount}</div>
          </div>`;
      }).join("");
    }

    async function loadHistory(){
      const h = await apiFetch("/api/history");
      renderHistory(h.items || []);
    }

    async function openWallet(){
      const boot = await apiFetch("/api/bootstrap");

      state.user_id = Number(boot.user_id || 0);
      state.points  = Math.max(0, Number(boot.points || 0));
      state.frozen  = Math.max(0, Number(boot.frozen_points || 0));
      state.trial   = Math.max(0, Number(boot.trial_points || 0));
      state.trial_note = boot.trial_note || "يسترد لاحقا";
      state.ton_address = boot.ton_address || "";

      state.point_name = boot.point_name || "بلي";
      state.point_price_usd = Number(boot.point_price_usd || 0);
      state.min_add_points = Number(boot.min_add_points || 10);

      // ✅ الحد الأدنى للإرسال من الداتا
      state.min_send_points = Number(boot.min_send_points || 13);

      // عناوين
      document.getElementById("brandTitle").textContent = `محفظة ${state.point_name}`;
      document.getElementById("brandSub").textContent = `TON • ${state.point_name}`;

      render();

      gate.style.display = "none";
      wallet.style.display = "flex";

      loadHistory().catch(() => renderHistory([]));
    }

    /* ================== Add (Modern compact sheet) ================== */
    document.getElementById("add").onclick = async ()=> {
      try{
        if (!state.point_price_usd || state.point_price_usd <= 0) {
          throw new Error("سعر البلي بالدولار غير متوفر حاليًا (من السيرفر).");
        }

        const r = await apiFetch("/api/add/request", {method:"POST"});
        let tonUsd = await fetchTonUsd();

        const name = state.point_name || "بلي";
        const minPts = Math.max(1, Number(state.min_add_points || 10));

        openSheet(`شراء ${name}`, `
          <div class="panel" style="margin-top:0">
            <div class="panelTitle">الحاسبة</div>

            <div class="hint" style="margin:0 0 8px">عدد ${name} (الحد الأدنى: <b>${minPts}</b>)</div>
            <input id="buyPts" class="field" type="number" inputmode="numeric" min="${minPts}" placeholder="مثال: 50">

            <div class="pills">
              <button class="pill" id="pMin">${minPts}</button>
              <button class="pill" id="p50">50</button>
              <button class="pill" id="p100">100</button>
              <button class="pill" id="p250">250</button>
            </div>

            <div class="panel" style="margin-top:12px">
              <div class="panelTitle">الملخص</div>
              <div class="kv"><span>سعر ${name}</span><b>${state.point_price_usd.toFixed(4)} USD</b></div>
              <div class="kv"><span>سعر TON</span><b id="tonUsdLine">${tonUsd.toFixed(4)} USD</b></div>
              <div class="kv"><span>الإجمالي</span><b id="totalUsd">—</b></div>
              <div class="kv"><span>المطلوب (TON)</span><b id="needTon">—</b></div>

              <div class="btnRow" style="margin-top:10px">
                <button class="btn ghost" id="refreshTon">تحديث سعر TON</button>
              </div>
              <div class="hint" style="margin:8px 0 0">الحساب تقديري حسب سعر TON الحالي.</div>
            </div>
          </div>

          <div class="panel">
            <div class="panelTitle">الدفع</div>

            <div class="hint" style="margin:0 0 8px">عنوان محفظة TON</div>
            <input class="field" readonly value="${r.ton_address}">
            <div class="btnRow">
              <button class="btn primary" id="c1">نسخ العنوان</button>
            </div>

            <div class="hint" style="margin:12px 0 8px">ضع هذا الكود في خانة Comment/Message</div>
            <input class="field" readonly value="${r.deposit_code}">
            <div class="btnRow">
              <button class="btn good" id="c2">نسخ كود التعليق</button>
            </div>

            <div class="hint" style="margin-top:10px">
              بعد التحويل، تتم إضافة ${name} حسب المعالجة في السيرفر.
            </div>
          </div>
        `);

        document.getElementById("c1").onclick = ()=> copy(r.ton_address);
        document.getElementById("c2").onclick = ()=> copy(r.deposit_code);

        function recalc() {
          const pts = Number(document.getElementById("buyPts").value || 0);
          const totalUsdEl = document.getElementById("totalUsd");
          const needTonEl = document.getElementById("needTon");

          if (!pts) { totalUsdEl.textContent = "—"; needTonEl.textContent = "—"; return; }
          if (pts < minPts) { totalUsdEl.textContent = "أقل من الحد الأدنى"; needTonEl.textContent = "—"; return; }

          const totalUsd = pts * state.point_price_usd;
          const needTon = totalUsd / tonUsd;

          totalUsdEl.textContent = totalUsd.toFixed(4) + " USD";
          needTonEl.textContent = needTon.toFixed(6) + " TON";
        }

        const buyPts = document.getElementById("buyPts");
        buyPts.addEventListener("input", recalc);

        document.getElementById("pMin").onclick = ()=> { buyPts.value = String(minPts); recalc(); };
        document.getElementById("p50").onclick = ()=> { buyPts.value = "50"; recalc(); };
        document.getElementById("p100").onclick = ()=> { buyPts.value = "100"; recalc(); };
        document.getElementById("p250").onclick = ()=> { buyPts.value = "250"; recalc(); };

        document.getElementById("refreshTon").onclick = async ()=> {
          try{
            toast("تحديث سعر TON…", "info", 1200);
            tonUsd = await fetchTonUsd();
            document.getElementById("tonUsdLine").textContent = tonUsd.toFixed(4) + " USD";
            recalc();
            toast("تم ✅", "ok", 1200);
          }catch{
            toast("فشل تحديث TON", "err");
          }
        };

      }catch(e){
        toast(String(e.message||e), "err");
      }
    };

    /* ================== Receive ================== */
    document.getElementById("receive").onclick = async ()=> {
      try{
        const r = await apiFetch("/api/receive/request", {method:"POST"});
        openSheet("استلام بلي", `
          <div class="panel" style="margin-top:0">
            <div class="panelTitle">كود الاستلام</div>
            <div class="hint" style="margin:0 0 8px">أرسل هذا الكود للمُرسل (ثابت ويمكن استخدامه)</div>
            <input class="field" readonly value="${r.receive_code}">
            <div class="btnRow">
              <button class="btn good" id="cr">نسخ الكود</button>
            </div>
          </div>
        `);
        document.getElementById("cr").onclick = ()=> copy(r.receive_code);
      }catch(e){
        toast(String(e.message||e), "err");
      }
    };

    /* ================== Send (min from DB) ================== */
    document.getElementById("send").onclick = async ()=> {
      const minSend = Math.max(1, Number(state.min_send_points || 13));
      const name = state.point_name || "بلي";

      openSheet("إرسال", `
        <div class="panel" style="margin-top:0">
          <div class="panelTitle">إرسال ${name}</div>

          <div class="hint" style="margin:0 0 8px">كود المستلم (RCV-XXXX)</div>
          <input id="to" class="field" placeholder="RCV-XXXXXXXX">

          <div class="hint" style="margin:12px 0 8px">عدد ${name} (الحد الأدنى: <b>${minSend}</b>)</div>
          <input id="amt" class="field" type="number" min="${minSend}" inputmode="numeric" placeholder="مثال: 25">

          <div class="hint" style="margin-top:10px">المتاح: <b>${state.points}</b></div>

          <div class="btnRow">
            <button class="btn primary" id="go">تسجيل الطلب</button>
            <button class="btn ghost" id="cancel">إلغاء</button>
          </div>
        </div>
      `);

      document.getElementById("cancel").onclick = closeSheet;

      document.getElementById("go").onclick = async ()=> {
        try{
          const recipient = (document.getElementById("to").value || "").trim().toUpperCase();
          const amount = parseInt(document.getElementById("amt").value || "0", 10);

          if (!recipient.startsWith("RCV-")) throw new Error("كود المستلم غير صحيح");
          if (amount < minSend) throw new Error(`الحد الأدنى للإرسال هو ${minSend} ${name}`);
          if (amount > state.points) throw new Error("لا يوجد رصيد كافي");

          toast("جاري تسجيل الطلب…", "info", 1200);
          await apiFetch("/api/send", {method:"POST", body:{recipient_code: recipient, amount}});
          await loadHistory();
          closeSheet();
          toast("تم ✅", "ok");
        }catch(e){
          toast(String(e.message||e), "err");
        }
      };
    };

    /* ================== Close app ================== */
    document.getElementById("closeApp").onclick = ()=> {
      const t = tg();
      if (t) t.close();
      else window.close();
    };

    /* ================== Init ================== */
    (function init(){
      const t = tg();
      if (!t){
        document.getElementById("open").disabled = true;
        showGateErr("ERROR NO TELEGRAM WEBAPP");
        return;
      }
      t.ready(); t.expand();
      if (!t.initData || t.initData.length === 0){
        document.getElementById("open").disabled = true;
        showGateErr("ERROR NO ENTRY");
      }
    })();

    document.getElementById("open").onclick = async ()=> {
      try{
        await loadApiJson();
        await openWallet();
      }catch(e){
        showGateErr(String(e.message||e));
      }
    };

    /* ✅ منع Gesture Zoom (بدون تعطيل scroll) */
    document.addEventListener("gesturestart", (e)=>{ e.preventDefault(); });
    document.addEventListener("gesturechange", (e)=>{ e.preventDefault(); });
    document.addEventListener("gestureend", (e)=>{ e.preventDefault(); });
  </script>
</body>
</html>
